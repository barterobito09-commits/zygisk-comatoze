name: Build Comatoze Zygisk
on:
  workflow_dispatch:
  push:
    paths:
      - 'comatoze-zygisk.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak sumber
        run: unzip -q -o comatoze-zygisk.zip && ls

      - name: Ambil zygisk.hpp (API v4, paling kompatibel)
        run: |
          git clone --depth 1 https://github.com/topjohnwu/zygisk-module-sample.git /tmp/zs
          cp /tmp/zs/module/jni/zygisk.hpp native/zygisk.hpp
          sed -i 's/^#define ZYGISK_API_VERSION .*/#define ZYGISK_API_VERSION 4/' native/zygisk.hpp
          grep -n "define ZYGISK_API_VERSION" native/zygisk.hpp
          grep -q "define ZYGISK_API_VERSION 4" native/zygisk.hpp

      - name: Uji logika parser
        run: g++ -std=c++17 -o /tmp/tp native/test_parse.cpp && /tmp/tp

      - name: Bangun .so (arm64-v8a + armeabi-v7a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          echo "NDK=$NDK"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          mkdir -p module/zygisk
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S native -B build-$abi \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build-$abi -j
            cp build-$abi/libcomatoze_zygisk.so module/zygisk/$abi.so
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded module/zygisk/$abi.so
          done
          ls -l module/zygisk
          file module/zygisk/*.so
          grep -qa SOC_MODEL module/zygisk/arm64-v8a.so

      - name: Unggah modul (zip siap flash)
        uses: actions/upload-artifact@v4
        with:
          name: Comatoze-v2_35_8-beta
          path: module/
          if-no-files-found: error
